[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eulaw"
version = "0.1.0"
description = "Grounded question answering over the EU AI Act and GDPR: provision-level retrieval, cited generation, and quantitative evaluation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
# Explicit selection so lint results are identical everywhere (local, CI):
# pycodestyle errors, pyflakes, and import sorting.
select = ["E4", "E7", "E9", "F", "I"]
