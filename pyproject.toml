[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askarxiv"
version = "0.1.0"
description = "RAG assistant over ML research papers: retrieval, generation with citations, and quantitative evaluation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]
